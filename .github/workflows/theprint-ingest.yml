name: ThePrint auto-ingest

# Mirrors new "Indian Liberals Matter" column pieces from ThePrint into the
# repo as theprint-mirror markdown, then commits them. This runs entirely on
# GitHub Actions — no Cloudflare deploy required — so ingestion is automatic.
#
# Schedule: weekly on Saturday (CCS round-2 feedback #16). Also runnable on
# demand via the "Run workflow" button (workflow_dispatch).
#
# Ingests both the English column (RSS) and the Hindi column. The Hindi column
# has no working RSS feed, so it is pulled from the WordPress REST API instead
# (hindi.theprint.in, category 326160) and mirrored with language: "hi".

on:
  schedule:
    - cron: "30 4 * * 6" # Saturdays 04:30 UTC = 10:00 IST
  workflow_dispatch:

# Never run two ingests at once.
concurrency:
  group: theprint-ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the admin-edit guard)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ingest dependencies
        working-directory: apps/theprint-ingest
        run: npm install --no-audit --no-fund

      - name: Run ingest
        id: ingest
        working-directory: apps/theprint-ingest
        env:
          # English column (RSS).
          RSS_FEED_URL: "https://theprint.in/category/opinion/indian-liberals-matter/feed/"
          # Hindi column (WordPress REST API — the Hindi RSS feed 404s). Override
          # HINDI_WP_CATEGORY via a repo variable if ThePrint changes the id.
          INGEST_HINDI: "1"
          HINDI_WP_BASE: "https://hindi.theprint.in"
          HINDI_WP_CATEGORY: ${{ vars.HINDI_WP_CATEGORY || '326160' }}
          BOT_COMMIT_EMAIL: "theprint-ingest@indianliberals.in"
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: npm run ingest:repo

      - name: Commit new mirror files
        run: |
          git config user.name "theprint-ingest-bot"
          git config user.email "theprint-ingest@indianliberals.in"
          if [ -n "$(git status --porcelain apps/site/src/content/theprint-mirror)" ]; then
            git add apps/site/src/content/theprint-mirror
            # NO [skip ci] here. The site auto-deploys via the git-connected
            # Cloudflare Pages project (indianliberals.in), and Cloudflare Pages
            # honours [skip ci] in the commit message — with it, the ingest
            # pushed the new column pieces to the repo but the production build
            # never ran, so the live "Latest from ThePrint" column never
            # refreshed. Dropping the marker lets the weekly ingest trigger a
            # Pages deploy. This workflow only runs on schedule/dispatch (never
            # on: push), so the push can't re-trigger it (Adnan, 2026-07).
            git commit -m "chore(theprint-ingest): weekly mirror update"
            git push
          else
            echo "No new or changed ThePrint pieces."
          fi
